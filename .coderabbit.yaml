# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  # docs/ is generated by `make generate`
  path_filters:
    - "!docs/**"
  path_instructions:
    - path: "internal/provider/**"
      instructions: |
        Design decisions that are intentional and documented, so don't flag them:
        - The security, privacy, settings, denylist, allowlist and rewrites
          resources manage the whole section of the profile: anything left out
          of the configuration is reset to its default or removed.
        - Their Delete does not change NextDNS; it only removes the resource
          from the Terraform state. nextdns_profile's Delete does delete the
          profile.
        - Only one of each of these resources per profile is supported.
        Do check that Read removes the resource from the state on HTTP 404,
        and that every attribute has a MarkdownDescription.
  pre_merge_checks:
    # Most functions without a comment are the standard Terraform resource
    # methods (Metadata, Schema, Create, ...), whose names say what they do.
    docstrings:
      mode: "off"
